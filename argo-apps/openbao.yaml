apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openbao
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://openbao.github.io/openbao-helm
    chart: openbao
    targetRevision: 0.30.3
    helm:
      values: |
        server:
          standalone:
            enabled: true
          ha:
            enabled: false
          service:
            type: NodePort
            nodePort: 30092
  destination:
    server: https://kubernetes.default.svc
    namespace: openbao
  # openbao-agent-injector self-signs a cert and patches this webhook's
  # caBundle at runtime (Helm installs it empty) — permanent, harmless
  # drift between the live object and git otherwise.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: openbao-agent-injector-cfg
      jqPathExpressions:
        - '.webhooks[]?.clientConfig.caBundle'
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
