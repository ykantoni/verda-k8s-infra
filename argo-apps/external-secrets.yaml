apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    targetRevision: 2.12.0
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # The SecretStore/ClusterSecretStore CRDs in this chart are large
      # enough that Argo CD's default client-side apply (which stores the
      # full manifest in a last-applied-configuration annotation) exceeds
      # Kubernetes' 256 KiB annotation limit. Server-side apply doesn't
      # use that annotation, so it doesn't hit the limit.
      - ServerSideApply=true
